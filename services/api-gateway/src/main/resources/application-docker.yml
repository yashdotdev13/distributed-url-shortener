server:
  port: 8081

spring:
  application:
    name: api-gateway

  data:
    redis:
      host: redis
      port: 6379
      timeout: 2s

  cloud:
    gateway:

      metrics:
        enabled: true

      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials

      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:3000"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true

      routes:

        - id: auth-service
          uri: lb://AUTH-SERVICE
          predicates:
            - Path=/api/v1/auth/**
          filters:
            - name: CircuitBreaker
              args:
                name: authServiceCircuitBreaker
                fallbackUri: forward:/fallback/auth

        - id: url-service
          uri: lb://URL-SERVICE
          predicates:
            - Path=/api/v1/urls/**

        - id: redirect-service
          uri: lb://REDIRECT-SERVICE
          predicates:
            - Path=/api/v1/r/**

        - id: analytic-service
          uri: lb://ANALYTIC-SERVICE
          predicates:
            - Path=/api/v1/analytics/**

jwt:
  secretKey: ThisIsMyVeryLongSecretKeyForDistributedUrlShortenerApplication123456789

eureka:
  client:
    service-url:
      defaultZone: http://discovery-server:8761/eureka/
    register-with-eureka: true
    fetch-registry: true

  instance:
    prefer-ip-address: true

management:

  endpoints:
    web:
      exposure:
        include: "*"

  endpoint:
    health:
      show-details: always

  prometheus:
    metrics:
      export:
        enabled: true

  tracing:
    enabled: true
    sampling:
      probability: 1.0

  otlp:
    tracing:
      endpoint: http://jaeger:4318/v1/traces

resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        slowCallRateThreshold: 100
        slowCallDurationThreshold: 5s
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        registerHealthIndicator: true

    instances:
      authServiceCircuitBreaker:
        baseConfig: default

rate-limit:
  login:
    capacity: 5
    refill-tokens: 5
    refill-duration-seconds: 60

  register:
    capacity: 3
    refill-tokens: 3
    refill-duration-seconds: 60

  create-url:
    capacity: 30
    refill-tokens: 30
    refill-duration-seconds: 60

  redirect:
    capacity: 300
    refill-tokens: 300
    refill-duration-seconds: 60

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"

  level:
    org.springframework.cloud.gateway: DEBUG
    org.springframework.cloud.gateway.route: TRACE
    org.springframework.cloud.gateway.handler.RoutePredicateHandlerMapping: TRACE
    reactor.netty: INFO
    io.github.resilience4j: INFO
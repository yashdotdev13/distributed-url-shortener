spring.application.name=analytic-service
server.port=8094



spring.datasource.url=jdbc:postgresql://postgres:5432/analytics_service_db
spring.datasource.username=postgres
spring.datasource.password=yash8252
spring.datasource.driver-class-name=org.postgresql.Driver


spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

spring.flyway.enabled=true


eureka.client.service-url.defaultZone=http://discovery-server:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

spring.kafka.bootstrap-servers=kafka:9092

spring.kafka.consumer.group-id=analytics-group
spring.kafka.consumer.auto-offset-reset=earliest

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

spring.kafka.consumer.properties.spring.json.trusted.packages=com.yashdotdev.common.events
spring.kafka.consumer.properties.spring.json.value.default.type=com.yashdotdev.common.events.ClickEvents


management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always

management.metrics.tags.application=${spring.application.name}
management.prometheus.metrics.export.enabled=true


management.tracing.enabled=true
management.tracing.sampling.probability=1.0
management.otlp.tracing.endpoint=http://jaeger:4318/v1/traces


logging.pattern.level=%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]

logging.level.root=INFO
logging.level.com.yashdotdev.analytic_service=DEBUG
logging.level.org.springframework.kafka=INFO


server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
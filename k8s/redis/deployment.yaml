apiVersion: apps/v1
kind: Deployment

metadata:
  name: redis
  namespace: distributed-url-shortener

spec:
  replicas: 1

  selector:
    matchLabels:
      app: redis

  template:

    metadata:
      labels:
        app: redis

    spec:

      containers:

        - name: redis

          image: redis:7-alpine

          imagePullPolicy: IfNotPresent

          command:
            - redis-server
            - --appendonly
            - "yes"

          ports:
            - containerPort: 6379

          volumeMounts:

            - name: redis-storage
              mountPath: /data

          readinessProbe:

            exec:
              command:
                - redis-cli
                - ping

            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:

            exec:
              command:
                - redis-cli
                - ping

            initialDelaySeconds: 15
            periodSeconds: 20

          resources:

            requests:
              cpu: 100m
              memory: 128Mi

            limits:
              cpu: 500m
              memory: 512Mi

      volumes:

        - name: redis-storage

          persistentVolumeClaim:
            claimName: redis-pvc
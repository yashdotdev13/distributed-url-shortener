apiVersion: v1
kind: PersistentVolumeClaim

metadata:
  name: redis-pvc
  namespace: distributed-url-shortener

  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/component: cache
    app.kubernetes.io/part-of: distributed-url-shortener

spec:

  accessModes:
    - ReadWriteOnce

  resources:
    requests:
      storage: 2Gi
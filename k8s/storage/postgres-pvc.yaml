apiVersion: v1
kind: PersistentVolumeClaim

metadata:
  name: postgres-pvc
  namespace: distributed-url-shortener

  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: distributed-url-shortener

spec:

  accessModes:
    - ReadWriteOnce

  resources:
    requests:
      storage: 10Gi
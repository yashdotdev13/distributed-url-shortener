services:

  postgres:

    image: ${POSTGRES_IMAGE}:${POSTGRES_VERSION}
    container_name: ${COMPOSE_PROJECT_NAME}-postgres

    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d

    healthcheck:
      test: ["CMD-SHELL","pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

    networks:
      - backend-network

  redis:

    image: ${REDIS_IMAGE}:${REDIS_VERSION}
    container_name: ${COMPOSE_PROJECT_NAME}-redis
    restart: unless-stopped

    command:
      - redis-server
      - --appendonly
      - "yes"

    ports:
      - "6379:6379"

    volumes:
      - redis-data:/data

    healthcheck:
      test: ["CMD","redis-cli","ping"]
      interval: 10s
      timeout: 5s
      retries: 10

    networks:
      - backend-network



  kafka:

    image: ${KAFKA_IMAGE}:${KAFKA_VERSION}
    container_name: ${COMPOSE_PROJECT_NAME}-kafka
    restart: unless-stopped

    ports:
      - "9092:9092"

    environment:

      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

    volumes:
      - kafka-data:/var/lib/kafka/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1 || exit 1"
        ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s

    networks:
      - backend-network


  jaeger:
    image: ${JAEGER_IMAGE}:${JAEGER_VERSION}
    container_name: ${COMPOSE_PROJECT_NAME}-jaeger
    restart: unless-stopped

    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"

    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--spider",
          "-q",
          "http://localhost:16686"
        ]
      interval: 20s
      timeout: 10s
      retries: 10

    networks:
      - backend-network


networks:

  backend-network:

    driver: bridge


volumes:
  postgres-data:
  redis-data:
  kafka-data: